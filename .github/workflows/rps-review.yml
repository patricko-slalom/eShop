name: RPS review

# Red Pen Squad review on every pull request. Installed by the framework's ci/install.py; see ci/README.md there.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rps-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rps-review:
    # Same-repo, non-draft, non-Dependabot pull requests only. Secrets are unavailable to forks, and PR code is untrusted.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the Red Pen Squad framework
        uses: actions/checkout@v4
        with:
          repository: schweitzer-m/ai-immersion-quality-review-framework
          ref: feat/ci-github-actions
          token: ${{ secrets.RPS_FRAMEWORK_TOKEN || github.token }}
          path: .rps-framework
          persist-credentials: false

      # Add the toolchain your profile's build and test commands need, for example:
      # - uses: actions/setup-dotnet@v4
      #   with:
      #     global-json-file: global.json

      - name: Red Pen Squad review
        uses: ./.rps-framework/ci
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # fail-on-severity: none
          # max-ai-credits: ''
