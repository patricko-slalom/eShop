# .rps/profile.yml: the Red Pen Squad profile for this repo.
# CI reads it from the BASE branch of each pull request, never from the PR, so a PR cannot change its own review rules.
# Commands are argument arrays. Anything you cannot or will not run in CI is the string "unavailable".
# `high_risk_paths` and `mandatory_checks` are your decisions; the defaults below are deliberately empty.
schema_version: 1
repo: eShop
repo_path: repos/eShop
languages: [csharp, javascript]
frameworks: []
commands:
  build: unavailable
  test: unavailable
  lint: unavailable
optional_tools:
  semgrep: {configured: false}
  gitleaks: {configured: false}
  trivy: {configured: false}
  sonar: {configured: false}
docs:
  readme: README.md
  architecture: unavailable
  confluence: unavailable
high_risk_paths: []              # for example ["src/Identity.API/*"]; a touched path stops for a human
mandatory_checks: []             # for example [build, test]; a missing or failing one blocks the check
reference_repos: []
requirements_source: null
